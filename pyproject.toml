[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "quant-engine-py"
# Mirrors the engine tag this is built against, so
# `quant-engine-py==0.5.3` is the binding for engine 0.5.3 and nothing
# has to be looked up. A fix to the bindings alone, between engine
# releases, goes out as 0.5.3.post1 -- which is what PyPI's post
# releases are for.
version = "0.5.3"
description = "nanobind bindings for quant-engine"
requires-python = ">=3.10"
# numpy is a RUNTIME dependency, not just a test one: every bar column
# comes back as `nb::ndarray<nb::numpy, ...>`, which fails to export
# with `ModuleNotFoundError: No module named 'numpy'` the first time a
# caller touches `.close`. Missed until a fresh clone was built from
# the README's own steps, where seven tests died on it: the dev venv
# had numpy installed by hand, so nothing ever asked where it came
# from.
dependencies = ["numpy>=1.23"]

# The README is the PyPI landing page. Without this the project page
# is a blank box under the one-line summary, which is what a reader
# who has never heard of this package sees first.
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Jiucheng Zang" }]
keywords = ["backtesting", "quantitative-finance", "trading", "nanobind"]

# Deliberately narrow, and each line is true rather than aspirational.
# "macOS :: macOS X" with no Linux classifier is the honest statement
# that there is no Linux wheel -- see the README.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://qe.jiucheng-zang.ca/python/"
Homepage = "https://qe.jiucheng-zang.ca/"
Source = "https://github.com/zangjiucheng/quant-engine-py"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/qe"]
